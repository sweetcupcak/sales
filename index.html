<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sales Dashboard">
<link rel="manifest" href="manifest.json">
<title>Sales Dashboard</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;color:#111;background:#f5f5f7}
*{box-sizing:border-box}body{margin:0}.app{max-width:680px;margin:auto;padding:18px 16px 34px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
h1{font-size:28px;margin:0}.muted{color:#777;font-size:13px}
button,select,input{font:inherit}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:700;background:#111;color:#fff}
.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 1px 4px #0000000b}
.balance-label{color:#777;font-size:14px}.balance{font-size:40px;font-weight:800;letter-spacing:-1.5px;margin:5px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{background:#fff;border-radius:16px;padding:16px}
.stat b{font-size:23px;display:block;margin-top:5px}.positive{color:#138a3d;font-size:13px;font-weight:700}
.chart-head{display:flex;justify-content:space-between;align-items:center}.chart-head b{font-size:17px}
canvas{width:100%;height:190px;margin-top:8px}
.orders h2{font-size:17px;margin:0 0 8px}.order{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #eee}
.order:last-child{border-bottom:0}.order-name{font-weight:700}.order-id{font-size:12px;color:#888;margin-top:2px}.price{font-weight:800;white-space:nowrap}
.controls{display:flex;gap:8px;flex-wrap:wrap}.controls .secondary{background:#fff;color:#111;border:1px solid #ddd}
.small{font-size:12px;color:#888;text-align:center;margin-top:14px}
.modal{display:none;position:fixed;inset:0;background:#0007;align-items:flex-end;justify-content:center;padding:12px}
.modal.show{display:flex}.sheet{background:#fff;border-radius:22px;padding:20px;width:min(680px,100%)}.sheet input{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;margin:10px 0}
@media(min-width:681px){.app{padding-top:28px}}
</style>
</head>
<body>
<main class="app">
<header><div><h1>Overview</h1><div class="muted">Sales & revenue</div></div><button class="btn" id="addBtn">＋ Sale</button></header>

<section class="card">
<div class="balance-label">Current balance</div>
<div class="balance" id="balance">$2,847.63</div>
<div class="positive">↗ <span id="change">12.8%</span> today</div>
</section>

<div class="grid">
<section class="stat"><div class="muted">Revenue</div><b id="revenue">$384.20</b><div class="muted">Today</div></section>
<section class="stat"><div class="muted">Orders</div><b id="orders">27</b><div class="muted">Today</div></section>
</div>

<section class="card">
<div class="chart-head"><b>Revenue trend</b><select id="range"><option value="7">7 days</option><option value="30">30 days</option></select></div>
<canvas id="revChart"></canvas>
</section>

<section class="card">
<div class="chart-head"><b>Sales trend</b><span class="muted">Orders</span></div>
<canvas id="salesChart"></canvas>
</section>

<section class="card orders">
<h2>Recent orders</h2><div id="ordersList"></div>
</section>

<div class="controls">
<button class="btn" id="randomBtn">Generate sale</button>
<button class="btn secondary" id="resetBtn">Reset</button>
</div>
<div class="small">Simulated account data · no real money or transactions</div>
</main>

<div class="modal" id="modal">
<div class="sheet">
<h2 style="margin:0">Add sale</h2>
<div class="muted">Enter a simulated sale amount.</div>
<input id="amount" type="number" min="0.01" step="0.01" value="24.99" inputmode="decimal">
<div class="controls"><button class="btn" id="confirm">Add sale</button><button class="btn secondary" id="cancel">Cancel</button></div>
</div>
</div>

<script>
const $=s=>document.querySelector(s);
let state={balance:2847.63,revenue:384.20,orders:27,rev:[210,275,238,318,292,341,384],sales:[15,18,16,21,19,23,27]};
const initial=[
["Desk organizer","#4821",42],["Phone stand","#4819",29.99],
["Desk mat","#4817",18.50],["Wireless accessory","#4814",34.99]
];

function money(n){return new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(n)}
function draw(canvas,data,labels,moneyAxis=false){
 const dpr=devicePixelRatio||1,w=canvas.clientWidth,h=190;canvas.width=w*dpr;canvas.height=h*dpr;
 const c=canvas.getContext("2d");c.scale(dpr,dpr);c.clearRect(0,0,w,h);
 const pad=24,max=Math.max(...data)*1.18||1,min=0;
 c.strokeStyle="#e9e9e9";c.lineWidth=1;
 for(let i=0;i<4;i++){let y=pad+i*(h-pad*2)/3;c.beginPath();c.moveTo(pad,y);c.lineTo(w-pad,y);c.stroke()}
 const pts=data.map((v,i)=>({x:pad+i*(w-pad*2)/(data.length-1),y:h-pad-(v-min)/(max-min)*(h-pad*2)}));
 c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y));c.strokeStyle="#111";c.lineWidth=3;c.stroke();
 c.fillStyle="#111";pts.forEach(p=>{c.beginPath();c.arc(p.x,p.y,3.5,0,Math.PI*2);c.fill()});
 c.fillStyle="#777";c.font="12px -apple-system,BlinkMacSystemFont,sans-serif";c.fillText(labels[0],pad,h-4);c.textAlign="right";c.fillText(labels[1],w-pad,h-4);c.textAlign="left";
}
function render(){
 $("#balance").textContent=money(state.balance);$("#revenue").textContent=money(state.revenue);$("#orders").textContent=state.orders;
 const days=$("#range").value==="30"?30:7;
 const rev=days===7?state.rev:state.rev.concat([401,390,420,438,410,452,468,455,480,493,470,510,525,501,540,558,545,570,590,578,610,625,603]);
 draw($("#revChart"),rev,days===7?["6d ago","Today"]:["30d ago","Today"]);
 draw($("#salesChart"),state.sales,["6d ago","Today"]);
}
function addOrder(amount){
 const row=document.createElement("div");row.className="order";
 row.innerHTML=`<div><div class="order-name">New order</div><div class="order-id">#${Math.floor(1000+Math.random()*9000)} · just now</div></div><div class="price">+${money(amount)}</div>`;
 $("#ordersList").prepend(row);while($("#ordersList").children.length>6)$("#ordersList").lastElementChild.remove();
}
function addSale(amount){amount=Math.round(amount*100)/100;if(!isFinite(amount)||amount<=0)return;
 state.balance+=amount;state.revenue+=amount;state.orders++;state.rev=state.rev.slice(1).concat([state.revenue]);state.sales=state.sales.slice(1).concat([state.orders]);addOrder(amount);render();
}
initial.forEach(o=>{const row=document.createElement("div");row.className="order";row.innerHTML=`<div><div class="order-name">${o[0]}</div><div class="order-id">${o[1]}</div></div><div class="price">+${money(o[2])}</div>`;$("#ordersList").append(row)});
$("#addBtn").onclick=()=>$("#modal").classList.add("show");
$("#cancel").onclick=()=>$("#modal").classList.remove("show");
$("#confirm").onclick=()=>{addSale(Number($("#amount").value));$("#modal").classList.remove("show")};
$("#randomBtn").onclick=()=>addSale(Math.random()*70+12);
$("#resetBtn").onclick=()=>{state={balance:2847.63,revenue:384.20,orders:27,rev:[210,275,238,318,292,341,384],sales:[15,18,16,21,19,23,27]};$("#ordersList").innerHTML="";initial.forEach(o=>{const row=document.createElement("div");row.className="order";row.innerHTML=`<div><div class="order-name">${o[0]}</div><div class="order-id">${o[1]}</div></div><div class="price">+${money(o[2])}</div>`;$("#ordersList").append(row)});render()};
$("#range").onchange=render;addEventListener("resize",render);render();
</script>
</body>
</html>
